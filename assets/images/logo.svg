<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="ds-logo-title" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title id="ds-logo-title">Dancing Spoon</title>
  <defs>
    <path id="ds-arc-top" d="M 36 100 A 64 64 0 0 1 164 100"/>
  </defs>
  <circle cx="100" cy="100" r="96" stroke-width="2.2"/>
  <circle cx="100" cy="100" r="88.5" stroke-width="1.1"/>
  <text font-family="Gloock, Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="3.2" fill="currentColor" stroke="none">
    <textPath href="#ds-arc-top" startOffset="50%" text-anchor="middle">DANCING</textPath>
  </text>
  <text x="100" y="163" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="5.5" text-anchor="middle" fill="currentColor" stroke="none">SPOON</text>
  <!-- spoon: handle, tip curl, bowl -->
  <path d="M 103 54 C 103 72 101.5 88 100 104" stroke-width="4.2"/>
  <path d="M 103 54 c 2.5 -1.2 5 0.6 4.6 3.4 c -0.4 2.6 -2.8 4.4 -5.2 4.2" stroke-width="2.4"/>
  <ellipse cx="100" cy="116" rx="10" ry="13.5" stroke-width="2.6"/>
  <path d="M 95.5 109.5 c 1.5 -2.8 4.8 -3.8 7.6 -2.4" stroke-width="1.5" opacity="0.7"/>
  <!-- the dance: a dashed back arc and a front arc that ends in an arrow -->
  <path d="M 74 122 A 26 7 0 0 1 126 122" stroke-width="1.9" stroke-dasharray="3 5" opacity="0.8"/>
  <path d="M 132 128 A 32 8.5 0 0 1 68 128.5" stroke-width="2.4"/>
  <path d="M 75 122.5 L 67 128.8 L 75.5 134.5" stroke-width="2.4"/>
</svg>
